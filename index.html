<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мои заявки">
<title>Мои заявки</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f4f6f9; --card: #fff; --text: #1d2633; --muted: #6b7686; --line: #e3e7ee;
  --brand: #1f3a5f; --brand-soft: #e6edf6; --ok: #0f7a55; --ok-soft: #e1f5ee;
  --warn: #9a5b00; --warn-soft: #fff3df; --bad: #b42318; --bad-soft: #fdecea;
  --ret: #6b3fa0; --ret-soft: #f1eafa;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11161d; --card: #1a212b; --text: #e6ebf2; --muted: #93a0b2; --line: #2a3442;
          --brand: #8fb4e8; --brand-soft: #22324a; --ok: #5dcaa5; --ok-soft: #12352b;
          --warn: #f0b45a; --warn-soft: #3a2a12; --bad: #f09595; --bad-soft: #3b1a1a;
          --ret: #c4a7ee; --ret-soft: #2e2240; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
       padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
header { position: sticky; top: 0; z-index: 2; background: var(--brand); color: #fff; padding: 14px 16px 10px; }
@media (prefers-color-scheme: dark) { header { background: #1a2a40; } }
header h1 { margin: 0; font-size: 18px; font-weight: 600; }
header .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
main { max-width: 640px; margin: 0 auto; padding: 12px 16px 40px; }
header { padding-bottom: 0; }
/* дни — табы на всю ширину шапки, без прокрутки: каждый таб делит ширину поровну */
.tabs { display: flex; margin: 10px -16px 0; }
.tabs:empty { display: none; }
.tab { flex: 1 1 0; min-width: 0; border: 0; border-bottom: 3px solid transparent; background: none;
       color: rgba(255,255,255,.72); padding: 6px 2px 7px; font: inherit; cursor: pointer; line-height: 1.2;
       -webkit-tap-highlight-color: transparent; }
.tab .tn { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden;
           text-overflow: ellipsis; }
.tab .td { display: block; font-size: 11px; opacity: .85; }
.tabs.many .tn { font-size: 12px; letter-spacing: -.01em; }
.tab.on { color: #fff; border-bottom-color: #fff; }
.tab .qn { min-width: 15px; padding: 0 4px; margin-left: 3px; font-size: 10px; line-height: 15px;
           font-weight: 600; vertical-align: 1px; opacity: 1; }
/* фильтр карточек: все / заявки / возвраты */
.seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px;
       margin-bottom: 10px; }
.seg button { flex: 1 1 0; min-width: 0; border: 0; background: none; color: var(--muted); border-radius: 7px;
              padding: 7px 4px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.seg .c { font-size: 12px; opacity: .8; margin-left: 4px; }
.notice { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
          margin-bottom: 12px; font-size: 14px; }
.notice button, .btn { margin-top: 8px; border: 0; border-radius: 10px; background: var(--brand); color: #fff;
          padding: 9px 14px; font: inherit; font-size: 14px; cursor: pointer; }
@media (prefers-color-scheme: dark) { .notice button, .btn { color: #11161d; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
.card.hot { border-color: var(--warn); }
.head { padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
.head .main { flex: 1; min-width: 0; }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.right { text-align: right; flex-shrink: 0; }
.sum { font-weight: 600; white-space: nowrap; }
.was { color: var(--muted); font-size: 12px; text-decoration: line-through; }
.chip { display: inline-block; font-size: 12px; border-radius: 10px; padding: 1px 8px; margin-top: 4px; }
.st-work { background: var(--brand-soft); color: var(--brand); }
.st-transferred { background: var(--ok-soft); color: var(--ok); }
.st-deleted { background: var(--bad-soft); color: var(--bad); }
.chg { background: var(--warn-soft); color: var(--warn); }
.events { border-top: 1px solid var(--line); padding: 4px 14px 10px; display: none; }
.card.open .events { display: block; }
.ev { padding: 8px 0; border-bottom: 1px dashed var(--line); }
.ev:last-child { border-bottom: 0; }
.ev .t { font-size: 14px; font-weight: 600; }
.ev.imp .t { color: var(--warn); }
.ev .w { color: var(--muted); font-size: 12px; }
.ev .l { font-size: 13px; color: var(--muted); }
.total { background: var(--brand-soft); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.total .tl { color: var(--muted); font-size: 13px; }
.total .tr { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-top: 2px; }
.total .tm { color: var(--muted); font-size: 13px; }
.total .share { margin-top: 10px; width: 100%; border: 0; border-radius: 10px; background: var(--brand); color: #fff;
                padding: 10px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
@media (prefers-color-scheme: dark) { .total .share { color: #11161d; } }
.total .ts { font-size: 22px; font-weight: 700; white-space: nowrap; color: var(--brand); }
.total .tret { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px;
               border-top: 1px solid var(--line); font-size: 15px; }
.total .tret b { color: var(--ret); white-space: nowrap; }
.sect { margin: 18px 2px 8px; font-weight: 600; color: var(--muted); font-size: 13px; text-transform: uppercase;
        letter-spacing: .04em; }
.ret { background: var(--ret-soft); color: var(--ret); }
.more { color: var(--muted); font-size: 12px; margin-top: 4px; white-space: nowrap; }
.card.open .more { visibility: hidden; }
.items { padding: 6px 0 8px; border-bottom: 1px solid var(--line); }
.it { display: grid; grid-template-columns: 1fr auto; column-gap: 10px; padding: 5px 0; }
.it .in { font-size: 14px; }
.it .iq { grid-column: 1; color: var(--muted); font-size: 12px; }
.it .is { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-weight: 600; font-size: 14px; white-space: nowrap; }
.docs { color: var(--muted); font-size: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.total .area { width: 100%; margin-top: 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px;
               font: inherit; font-size: 14px; background: var(--card); color: var(--text); }
.card.ask { border-color: var(--bad); }
.q { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: var(--bad-soft); }
.q .qt { color: var(--bad); font-weight: 600; font-size: 14px; }
.q .qd { color: var(--muted); font-size: 12px; margin-top: 2px; }
.q.fx { background: var(--brand-soft); }
.q.fx .qt { color: var(--brand); }
.ev .t.ok { color: var(--ok); }
.qn { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad);
      color: #fff; font-size: 12px; text-align: center; }
.empty { color: var(--muted); text-align: center; padding: 40px 10px; }
input.code { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px; font: inherit;
             background: var(--card); color: var(--text); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Мои заявки</h1>
  <div class="sub" id="sub">Загрузка…</div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main>
  <div id="push"></div>
  <div id="seg"></div>
  <div id="list"></div>
</main>
<script src="config.js"></script>
<script>
// app.js — с версией из version.json (его пишет cabinet_publish.py при выкладке; мимо кэша): новая версия кабинета подхватывается сразу,
// без ручной очистки кэша в установленном приложении (сверка версий дальше — в app.js)
(function () {
  function go(v) {
    window.APP_VER = v;
    var s = document.createElement("script");
    s.src = "app.js?v=" + encodeURIComponent(v || Date.now());
    document.body.appendChild(s);
  }
  fetch("version.json?_=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (j) { go(j.v || ""); }, function () { go(""); });
})();
</script>
</body>
</html>
